<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="#d97706" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Outer Cog / Gear -->
  <g transform="translate(256,220)" fill="url(#gold)">
    <circle r="140" fill="none" stroke="url(#gold)" stroke-width="28" stroke-dasharray="32 18"/>
    <circle r="100" fill="#0f172a" stroke="url(#gold)" stroke-width="8"/>
    <!-- Center Trotro / Van Symbol -->
    <path d="M-55,20 L-55,0 C-55,-15 -40,-28 -20,-28 L20,-28 C40,-28 55,-15 55,0 L55,20 Z" fill="url(#gold)" opacity="0.9"/>
    <!-- Windshield -->
    <path d="M-40,8 L-40,-5 C-40,-12 -30,-18 -15,-18 L15,-18 C30,-18 40,-12 40,-5 L40,8 Z" fill="#0f172a"/>
    <!-- Headlights -->
    <circle cx="-35" cy="24" r="7" fill="#fef08a"/>
    <circle cx="35" cy="24" r="7" fill="#fef08a"/>
    <!-- Grille -->
    <rect x="-18" y="20" width="36" height="8" rx="4" fill="#0f172a"/>
  </g>
  
  <!-- Crossing Wrench & Screwdriver / Spark -->
  <circle cx="256" cy="220" r="16" fill="url(#gold)"/>

  <!-- Brand Typography -->
  <text x="256" y="410" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">STELLA</text>
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#fbbf24" text-anchor="middle" letter-spacing="4">SPARE PART LTD</text>
</svg>
